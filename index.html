<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate images from text and interact with an AI chatbot. Explore image generation and AI chat capabilities.">
    <meta name="keywords" content="text to image, AI chatbot, image generation, artificial intelligence, Hugging Face API">
    <meta name="author" content="Wanzzbot">
    <meta property="og:title" content="Text to Image and AI Chat">
    <meta property="og:description" content="Generate images from text and interact with an AI chatbot using advanced AI technologies.">
    <meta property="og:image" content="assets/img/preview.jpg">
    <meta property="og:url" content="https://yourdomain.com">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Text to Image and AI Chat">
    <meta name="twitter:description" content="Generate images from text and interact with an AI chatbot using advanced AI technologies.">
    <meta name="twitter:image" content="assets/img/preview.jpg">
    <title>AI Creation Studio | Image Generation & Chat</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="icon" href="assets/img/logo.svg">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="assets/img/logo.svg" alt="AI Creation Studio Logo">
                <h1>AI Creation Studio</h1>
            </div>
            <div class="theme-toggle">
                <button id="theme-switch"><i class="fas fa-moon"></i></button>
            </div>
        </header>

        <main>
            <div class="tabs">
                <button class="tab-btn active" data-tab="image">
                    <i class="fas fa-image"></i> Generate Image
                </button>
                <button class="tab-btn" data-tab="chat">
                    <i class="fas fa-comment-dots"></i> AI Chat
                </button>
            </div>

            <div class="content-area">
                <div id="image-tab" class="tab-content active">
                    <h2>Create Images from Text</h2>
                    <div class="input-group">
                        <textarea id="image-prompt" placeholder="Describe the image you want to create..."></textarea>
                        <div class="controls">
                            <select id="image-model">
                                <option value="stabilityai/stable-diffusion-2-1">Stable Diffusion 2.1</option>
                                <option value="prompthero/openjourney">Openjourney</option>
                                <option value="runwayml/stable-diffusion-v1-5">Stable Diffusion 1.5</option>
                            </select>
                            <button id="generate-image" class="primary-btn">
                                <i class="fas fa-wand-magic-sparkles"></i> Generate
                            </button>
                        </div>
                    </div>
                    <div class="result-container">
                        <div id="image-loading" class="loading-indicator">
                            <div class="spinner"></div>
                            <p>Creating your masterpiece...</p>
                        </div>
                        <div id="image-result" class="result"></div>
                        <button id="download-image" class="secondary-btn">
                            <i class="fas fa-download"></i> Download
                        </button>
                    </div>
                </div>

                <div id="chat-tab" class="tab-content">
                    <h2>Chat with AI Assistant</h2>
                    <div class="chat-container">
                        <div id="chat-history" class="chat-history">
                            <div class="chat-message system">
                                <div class="avatar">
                                    <i class="fas fa-robot"></i>
                                </div>
                                <div class="message">
                                    Hello! I'm your AI assistant. How can I help you today?
                                </div>
                            </div>
                        </div>
                        <div class="chat-input">
                            <textarea id="chat-prompt" placeholder="Type your message here..."></textarea>
                            <button id="send-chat" class="primary-btn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2025 AI Creation Studio | Powered by Hugging Face API</p>
            <div class="social-links">
                <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
                <a href="#" title="Twitter"><i class="fab fa-twitter"></i></a>
            </div>
        </footer>
    </div>

    <script src="assets/js/imageGenerator.js"></script>
    <script src="assets/js/aiChat.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
